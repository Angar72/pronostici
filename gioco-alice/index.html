<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="icon2-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-2.png">
<link rel="manifest" href="manifest2.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gioco Alice">
<meta name="theme-color" content="#fff7ef">
<title>Alice: e/è e a/ha</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff7ef;--card:#fff;--ink:#2b2140;--muted:#7a6f8c;--pri:#7c4dff;--ok:#1fa463;--ko:#e5484d;--e:#ff8a3d;--a:#2fb4c9}
  *{box-sizing:border-box}
  body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:680px}
  h1{font-weight:900;font-size:2rem;margin:.2em 0 .1em;text-align:center}
  .sub{text-align:center;color:var(--muted);margin-bottom:22px}
  .card{background:var(--card);border-radius:22px;box-shadow:0 8px 30px rgba(60,30,100,.08);padding:26px}
  .modes{display:grid;gap:14px}
  .mode{border:none;border-radius:18px;padding:20px;font:inherit;font-size:1.25rem;font-weight:800;color:#fff;cursor:pointer;text-align:left;transition:transform .1s}
  .mode:hover{transform:scale(1.02)}
  .mode small{display:block;font-weight:400;font-size:.9rem;opacity:.95;margin-top:4px}
  .m-e{background:var(--e)} .m-a{background:var(--a)} .m-mix{background:var(--pri)}
  .rules{margin-top:20px;font-size:.98rem;line-height:1.5}
  .rules div{background:#f5f0ff;border-radius:14px;padding:12px 14px;margin-top:10px}
  .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:700;margin-bottom:10px}
  .bar{height:10px;background:#eee6f7;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
  .sentence{font-size:1.6rem;line-height:1.5;text-align:center;margin:18px 0 28px;font-weight:700}
  .blank{display:inline-block;min-width:70px;border-bottom:4px dashed var(--pri);color:var(--pri);padding:0 6px}
  .blank.ok{color:var(--ok);border-color:var(--ok);border-bottom-style:solid}
  .blank.ko{color:var(--ko);border-color:var(--ko)}
  .choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .ch{min-width:120px;font:inherit;font-size:2rem;font-weight:900;padding:14px 26px;border-radius:18px;border:3px solid #e0d6f2;background:#fff;color:var(--ink);cursor:pointer}
  .ch:hover:not(:disabled){border-color:var(--pri);background:#f5f0ff}
  .ch:disabled{cursor:default;opacity:.55}
  .ch.right{border-color:var(--ok);background:#e6f7ee;opacity:1}
  .ch.wrong{border-color:var(--ko);background:#fdecec;opacity:1}
  .fb{margin-top:24px;border-radius:16px;padding:16px;font-size:1.05rem;line-height:1.5;display:none}
  .fb.ok{display:block;background:#e6f7ee}
  .fb.ko{display:block;background:#fdecec}
  .fb b{font-size:1.15rem}
  .trick{margin-top:8px;color:var(--muted);font-style:italic}
  .hintbtn{background:none;border:none;color:var(--pri);font:inherit;font-weight:700;cursor:pointer;margin-top:14px;display:block;margin-left:auto;margin-right:auto}
  .hint{display:none;text-align:center;color:var(--muted);margin-top:6px}
  .next{display:none;margin:20px auto 0;font:inherit;font-weight:800;font-size:1.2rem;background:var(--pri);color:#fff;border:none;border-radius:14px;padding:12px 34px;cursor:pointer}
  .auto{display:none;height:6px;background:#eee6f7;border-radius:99px;overflow:hidden;margin:18px auto 0;max-width:260px}
  .auto i{display:block;height:100%;width:100%;background:var(--pri)}
  .clock{display:flex;align-items:center;gap:10px;margin:0 auto 4px;max-width:320px;font-weight:900;color:var(--pri)}
  .clock span{min-width:44px;height:44px;border-radius:50%;background:#f5f0ff;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
  .clock span:before{content:"⏱";font-size:.8rem;margin-right:1px}
  .cbar{flex:1;height:10px;background:#eee6f7;border-radius:99px;overflow:hidden}
  .cbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb300,#7c4dff)}
  .clock.hurry{color:var(--ko)} .clock.hurry span{background:#fdecec;animation:shake .4s infinite}
  .sbtn{background:none;border:none;font-size:1.2rem;cursor:pointer;margin-left:8px;padding:0}
  .play{display:block;margin:6px auto 4px;font:inherit;font-weight:900;font-size:1.6rem;color:#fff;border:none;border-radius:99px;padding:16px 48px;cursor:pointer;background:linear-gradient(90deg,var(--e),var(--pri),var(--a));box-shadow:0 8px 24px rgba(124,77,255,.35);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .sbtop{text-align:right;margin:-8px -6px 0}
  .stage{display:grid;grid-template-columns:96px 1fr 96px;gap:12px;align-items:center;min-height:220px}
  .side{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transition:transform .8s cubic-bezier(.34,1.56,.64,1),opacity .5s;position:relative;z-index:2}
  .side img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--gc);background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .side span{font-weight:900;font-size:.85rem}
  .side.left{transform:translateX(-160%)} .side.right{transform:translateX(160%)}
  .side.in{opacity:1;transform:none}
  .side.in.center-pos{transform:translateY(-6px) scale(1.25)}
  .side.idle img{animation:float 3s ease-in-out infinite}
  .side.right.idle img{animation-delay:1.5s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-3deg)}75%{transform:translateY(-3px) rotate(3deg)}}
  .side img.talking{animation:talk .35s ease-in-out infinite}
  @keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.07) translateY(-3px)}}
  .center{display:flex;flex-direction:column;gap:12px}
  .talk{opacity:0;transform:scale(.8);transition:all .35s;background:#f5f0ff;border-radius:18px;padding:14px 16px;font-weight:900;font-size:1.25rem;text-align:center;position:relative}
  .talk.show{opacity:1;transform:none}
  .talk small{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
  .talk.from-a{background:#fff0e5} .talk.from-a small{color:var(--e)}
  .talk.from-g{background:#e3f6f9} .talk.from-g small{color:var(--a)}
  .talk.final{background:none;padding:0 0 4px;font-size:1.3rem}
  #modes{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s,max-height .6s;pointer-events:none;max-height:0;overflow:hidden}
  #modes.show{opacity:1;transform:none;pointer-events:auto;max-height:600px;overflow:visible}
  #modes .mode{padding:16px;font-size:1.15rem}
  #rules{opacity:0;max-height:0;overflow:hidden;transition:opacity .6s,max-height .6s} #rules.show{opacity:1;max-height:500px}
  @media(max-width:520px){.stage{grid-template-columns:62px 1fr 62px;gap:6px}.side img{width:62px;height:62px;border-width:3px}#modes .mode{padding:12px;font-size:1rem}#modes .mode small{font-size:.75rem}.talk{font-size:1.05rem}.side.in.center-pos{transform:scale(1.15)}}
  .vtalk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px}
  .ivideo{width:100%;max-width:260px;aspect-ratio:1/1;border-radius:22px;object-fit:cover;background:#faf4ec;border:4px solid var(--e);transition:border-color .3s}
  .from-g .ivideo{border-color:var(--a)}
  #cap{font-weight:900;font-size:1.2rem}
  .skip{background:none;border:none;color:var(--muted);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
  .stats div{background:#f5f0ff;border-radius:14px;padding:8px 4px;text-align:center}
  .stats b{display:block;font-size:1.5rem;font-weight:900;color:var(--pri)}
  .stats span{font-size:.75rem;color:var(--muted);font-weight:700}
  .tottitle{text-align:center;font-weight:900;margin-top:18px;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.05em}
  .oggi{border-radius:16px;padding:12px 14px;margin:14px 0 6px;font-weight:900;text-align:center;line-height:1.35}
  .oggi small{display:block;font-weight:700;font-size:.85rem;margin-top:3px}
  .oggi.ok{background:#e6f7ee;color:#137a47} .oggi.todo{background:#fff3e0;color:#a85a00}
  .wa{display:inline-block;margin-top:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:900;border-radius:99px;padding:8px 18px;font-size:.95rem}
  .wa.wabig{font-size:1.1rem;padding:12px 24px}
  .sblocco{background:#e6f7ee;border-radius:18px;padding:16px;text-align:center;font-weight:900;margin:10px 0 16px;color:#137a47}
  .sblocco.no{background:#fff3e0;color:#a85a00}
  .sblocco .cod{font-size:2.6rem;letter-spacing:.2em;margin:6px 0 0;color:var(--ink)}
  .sblocco .small{font-size:.85rem;font-weight:700;opacity:.85}
  .m-p{background:#2fa36b}
  .probl{display:block;font-size:1.15rem;line-height:1.5;text-align:left;font-weight:700;background:#f7f4fb;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .rlab{font-size:1.2rem}
  .ver{text-align:center;color:var(--muted);font-size:.75rem;margin-top:12px;opacity:.7}
  .big{font-size:3.5rem;text-align:center;margin:6px 0}
  .score{font-size:1.5rem;text-align:center;font-weight:900}
  .msg{text-align:center;color:var(--muted);margin:8px 0 18px}
  .rev{margin-top:14px}
  .rev div{background:#fdecec;border-radius:12px;padding:10px 14px;margin-top:8px}
  .rev .c{color:var(--ok);font-weight:900}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{font:inherit;font-weight:800;font-size:1.05rem;border:none;border-radius:14px;padding:12px 22px;cursor:pointer;color:#fff;background:var(--pri)}
  .btn.sec{background:#e9e1f7;color:var(--ink)}
  .best{text-align:center;color:var(--muted);font-size:.9rem;margin-top:14px}
  .guide{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .guide img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid var(--gc,var(--pri));background:#fff;flex-shrink:0;transition:transform .25s}
  .guide img.pop{animation:pop .45s}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .guide img.shake{animation:shake .4s}
  .bubble{position:relative;background:#f5f0ff;border-radius:16px;padding:12px 16px;font-weight:700;line-height:1.4}
  .bubble:before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#f5f0ff;border-left:0}
  .bubble small{display:block;font-weight:900;color:var(--gc,var(--pri));font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  .hero{display:block;width:100%;max-width:330px;margin:0 auto 14px;border-radius:20px}
  .herotxt{text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:20px}
  @media(max-width:500px){.sentence{font-size:1.3rem}.ch{min-width:100px;font-size:1.7rem}}
</style>
</head>

function salva(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function leggi(k){try{return localStorage.getItem(k)}catch(e){return null}}
function mescola(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function splash(){
  app.innerHTML = `
    <img class="hero" src="${IMG.amici}" alt="Alice e Giulia">
    <div class="herotxt">Ciao! Siamo <span style="color:var(--e)">Alice</span> e <span style="color:var(--a)">Giulia</span> 💖</div>
    <button class="play" onclick="audio(); home(true)">▶ Gioca</button>
    ${boxOggi()}
    <div class="tottitle">Il tuo allenamento</div>${statBox()}`;
}

function parla(testo, chi){
  return new Promise(res=>{
    const durata = 900 + testo.length*70;
    let fatto=false; const fine=()=>{ if(!fatto){fatto=true; res();} };
    setTimeout(fine, durata+1800);
    if(!suonoOn || !('speechSynthesis' in window)){ setTimeout(fine, durata); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(testo);
      u.lang='it-IT';
      const voci = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('it'));
      const fem = voci.filter(v=>/female|donna|alice|elsa|federica|paola|isabella|giulia/i.test(v.name));
      const lista = fem.length?fem:voci;
      if(lista.length) u.voice = chi==='a' ? lista[0] : (lista[1]||lista[0]);
      u.pitch = chi==='a' ? 1.35 : 1.1; u.rate = 1.0;
      u.onend = ()=>setTimeout(fine,250); u.onerror = ()=>setTimeout(fine,durata);
      speechSynthesis.speak(u);
    }catch(e){ setTimeout(fine, durata); }
  });
}

function bocca(id, idle, talk, durataMs){
  const img = document.getElementById(id); if(!img) return ()=>{};
  img.classList.add('talking');
  let t=false; const iv=setInterval(()=>{ t=!t; img.src = IMG[t?talk:idle]; },170);
  return ()=>{ clearInterval(iv); img.src = IMG[idle]; img.classList.remove('talking'); };
}

function aspetta(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function home(intro){
  clearInterval(countdown); clearTimeout(timer);
  app.innerHTML = `
    <div class="sbtop"><button class="sbtn" onclick="toggleSuono()">${suonoOn?'🔊':'🔇'}</button></div>
    ${boxOggi()}
    ${statBox()}
    <div class="stage">
      <div class="side left" id="sideA"><img id="imgA" src="${IMG.a1}" alt="Alice" style="--gc:var(--e)"><span>Alice</span></div>
      <div class="center">
        <div class="talk" id="talk"></div>
        <div class="modes" id="modes">
          <button class="mode m-e" onclick="inizia('e')">e oppure è ?<small>Congiunzione o verbo essere</small></button>
          <button class="mode m-a" onclick="inizia('a')">a oppure ha ?<small>Preposizione o verbo avere</small></button>
          <button class="mode m-mix" onclick="inizia('mix')">Tutto mescolato 🎲<small>Frasi e problemi insieme</small></button>
          <button class="mode m-p" onclick="inizia('p')">Problemi ➕➖<small>Addizioni e sottrazioni</small></button>
        </div>
      </div>
      <div class="side right" id="sideG"><img id="imgG" src="${IMG.g1}" alt="Giulia" style="--gc:var(--a)"><span>Giulia</span></div>
    </div>
    <div class="rules" id="rules">
      <div><b>è</b> con l'accento è il verbo <b>essere</b>.<br>🔎 Trucco: prova a mettere <b>"era"</b>. Se la frase ha senso → <b>è</b>. Se no → <b>e</b>.</div>
      <div><b>ha</b> con l'acca è il verbo <b>avere</b>.<br>🔎 Trucco: prova a mettere <b>"aveva"</b>. Se la frase ha senso → <b>ha</b>. Se no → <b>a</b>.</div>
    </div>`;
  const sA=document.getElementById('sideA'), sG=document.getElementById('sideG'), talk=document.getElementById('talk'), modes=document.getElementById('modes'), rules=document.getElementById('rules');
  if(!intro){
    sA.classList.add('in','idle'); sG.classList.add('in','idle'); modes.classList.add('show'); rules.classList.add('show');
    talk.className='talk show final'; talk.innerHTML='Quale test vuoi fare?'; return;
  }
  // Introduzione con video (voce e labiale veri)
  talk.className='talk show from-a vtalk';
  talk.innerHTML = `<video id="iv" class="ivideo" playsinline webkit-playsinline preload="auto" src="${INTRO_VIDEO}"></video>
    <div id="cap"><small>Alice</small>Sei pronta a giocare? 🎉</div>
    <button class="skip" id="skip">Salta ⏭</button>`;
  const v=document.getElementById('iv'), cap=document.getElementById('cap');
  sA.classList.add('in','center-pos');
  let giulia=false, finito=false;
  const fine=()=>{
    if(finito || !document.getElementById('sideA')) return; finito=true;
    try{v.pause()}catch(e){}
    sA.classList.add('in'); sG.classList.add('in');
    sA.classList.remove('center-pos'); sG.classList.remove('center-pos');
    sA.classList.add('idle'); sG.classList.add('idle');
    talk.className='talk show final'; talk.innerHTML='Quale test vuoi fare?';
    modes.classList.add('show'); setTimeout(()=>rules.classList.add('show'),300);
  };
  const passaGiulia=()=>{
    if(giulia) return; giulia=true;
    sA.classList.remove('center-pos'); sA.classList.add('idle');
    sG.classList.add('in','center-pos');
    talk.className='talk show from-g vtalk';
    cap.innerHTML='<small>Giulia</small>Quale test vuoi fare? 🤔';
  };
  v.addEventListener('timeupdate',()=>{ if(v.currentTime>=4.0) passaGiulia(); });
  v.addEventListener('ended',()=>setTimeout(fine,300));
  document.getElementById('skip').onclick=fine;
  v.muted = !suonoOn;
  const p = v.play();
  if(p && p.catch) p.catch(()=>{ v.muted=true; v.play().catch(()=>setTimeout(fine,1500)); });
  setTimeout(fine, 12000);
}

  (a,b,n)=>`${cap(n)} ha ${a} caramelle. Ne regala ${b} agli amici. Quante caramelle ha ancora?`,
  (a,b)=>`In un albero ci sono ${a} uccellini. Ne volano via ${b}. Quanti uccellini restano sull'albero?`,
  (a,b)=>`Sull'autobus ci sono ${a} persone. Alla fermata ne scendono ${b}. Quante persone restano sull'autobus?`,
  (a,b,n)=>`${cap(n)} ha ${a} euro. Compra un libro che costa ${b} euro. Quanti euro ha ancora?`,
  (a,b)=>`Un libro ha ${a} pagine. Alice ne ha già lette ${b}. Quante pagine le mancano per finirlo?`,
  (a,b)=>`Per la torta servono ${a} grammi di zucchero. Nella ciotola ce ne sono già ${b}. Quanti grammi bisogna ancora aggiungere?`,
  (a,b,n)=>`${cap(n)} aveva ${a} matite colorate. Ne ha perse ${b}. Quante matite colorate ha adesso?`,
  (a,b)=>`Al cinema ci sono ${a} posti. ${b} posti sono già occupati. Quanti posti sono ancora liberi?`,
];
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function creaProblema(){
  const somma = Math.random()<0.5;
  let a,b,ris,testo;
  const n = pick(NOMI);
  if(somma){ a=rnd(5,60); b=rnd(3,40); ris=a+b; testo=pick(MODELLI_ADD)(a,b,n); }
  else { a=rnd(15,99); b=rnd(3,a-4); ris=a-b; testo=pick(MODELLI_SOT)(a,b,n); }
  const sbagliata = somma ? Math.abs(a-b) : a+b;   // risultato con l'operazione sbagliata
  const set = new Set([ris, sbagliata]);
  while(set.size<3){ const d = ris + pick([-10,-2,-1,1,2,10]); if(d>0) set.add(d); }
  const scelte = mescola([...set]).map(String);
  const spieg = somma
    ? `Qualcosa si <b>aggiunge</b> o si mette <b>insieme</b>, quindi è un'<b>addizione</b>: ${a} + ${b} = <b>${ris}</b>.`
    : `Qualcosa si <b>toglie</b> (o si cerca quanto <b>manca</b>), quindi è una <b>sottrazione</b>: ${a} − ${b} = <b>${ris}</b>.`;
  return [testo, String(ris), 'p', scelte, spieg, somma?'pA':'pG', String(sbagliata), somma];
}

function inizia(m){
  modo = m;
  if(m==='p'){ giro=[]; for(let i=0;i<PER_GIRO;i++) giro.push(creaProblema()); idx=0; punti=0; errori=[]; domanda(); return; }
  if(m==='mix'){
    const e3 = mescola(DATI.e).slice(0,3).map(x=>[...x,'e']);
    const a3 = mescola(DATI.a).slice(0,3).map(x=>[...x,'a']);
    const p4 = [creaProblema(),creaProblema(),creaProblema(),creaProblema()];
    giro = mescola([...e3,...a3,...p4]); idx=0; punti=0; errori=[]; domanda(); return;
  }
  let pool = m==='e' ? DATI.e.map(x=>[...x,'e']) : m==='a' ? DATI.a.map(x=>[...x,'a']) : [...DATI.e.map(x=>[...x,'e']),...DATI.a.map(x=>[...x,'a'])];
  giro = mescola(pool).slice(0,PER_GIRO); idx=0; punti=0; errori=[];
  domanda();
}

function domanda(){
  const [frase, giusta, tipo] = giro[idx];
  const gk = tipo==='p' ? giro[idx][5] : tipo;
  const scelte = tipo==='e' ? ['e','è'] : tipo==='a' ? ['a','ha'] : giro[idx][3];
  const parti = tipo==='p' ? [`<span class="probl">${frase}</span><br><span class="rlab">Risposta: </span>`, ''] : frase.split('___');
  app.innerHTML = `
    <div class="top"><span>Domanda ${idx+1} di ${giro.length}</span><span>📚 <span id="totq">${num('tot_esercizi')}</span> &nbsp;⭐ ${punti} <button class="sbtn" onclick="toggleSuono()">${suonoOn?'🔊':'🔇'}</button></span></div>
    <div class="bar"><i style="width:${idx/giro.length*100}%"></i></div>
    <div id="guida">${guida(gk, GUIDE[gk].pensa, pick(GUIDE[gk].domande))}</div>
    <div class="sentence">${parti[0]}<span class="blank" id="blank">?</span>${parti[1]}</div>
    <div class="choices">${scelte.map(s=>`<button class="ch" onclick="rispondi(this,'${s}')">${s}</button>`).join('')}</div>
    <button class="hintbtn" id="hb" onclick="document.getElementById('hint').style.display='block';this.style.display='none'">💡 Aiutino</button>
    <div class="hint" id="hint">${tipo==='e' ? 'Prova a mettere <b>"era"</b> al posto dello spazio: ha senso?' : tipo==='a' ? 'Prova a mettere <b>"aveva"</b> al posto dello spazio: ha senso?' : 'Se qualcosa si <b>aggiunge</b> o si mette insieme → <b>+</b>. Se qualcosa si <b>toglie</b> o si cerca quanto <b>manca</b> → <b>−</b>.'}</div>
    <div class="fb" id="fb"></div>
    <div class="auto" id="auto"><i id="autobar"></i></div>`;
  avviaTempo();
}

function avviaTempo(){}

function rispondi(btn, scelta){
  const [frase, giusta, tipo] = giro[idx];
  clearInterval(countdown);
  const scaduto = scelta===null;
  const ok = scelta===giusta;
  document.querySelectorAll('.ch').forEach(b=>{b.disabled=true; if(b.textContent===giusta) b.classList.add('right')});
  if(btn && !ok) btn.classList.add('wrong');
  const bl = document.getElementById('blank');
  bl.textContent = giusta; bl.classList.add(ok?'ok':'ko');
  document.getElementById('hb').style.display='none';
  document.getElementById('hint').style.display='none';
  const gk = tipo==='p' ? giro[idx][5] : tipo;
  const prova = tipo==='e' ? 'era' : 'aveva';
  const fraseProva = frase.replace('___', `<u>${prova}</u>`);
  const haSenso = (giusta==='è'||giusta==='ha');
  const spieg = tipo==='p' ? giro[idx][4] : tipo==='e'
    ? (haSenso ? `Qui c'è il verbo <b>essere</b>, quindi ci vuole <b>è</b> con l'accento.` : `Qui <b>e</b> serve a unire due cose, come "e anche". Niente accento!`)
    : (haSenso ? `Qui c'è il verbo <b>avere</b>, quindi ci vuole <b>ha</b> con l'acca.` : `Qui <b>a</b> è una preposizione (dove? a chi? quando?). Niente acca!`);
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok?'ok':'ko');
  const G = GUIDE[gk];
  document.getElementById('guida').innerHTML = ok
    ? guida(gk, pick(G.ok), pick(BRAVO), 'pop')
    : guida(gk, G.ko, scaduto ? 'Tempo scaduto! ⏰ La prossima volta sii più veloce!' : pick(G.ko_frasi), 'shake');
  fb.innerHTML = `<b>${ok ? 'Risposta giusta: "'+giusta+'"' : (scaduto?'⏰ Tempo scaduto! ':'')+'Ci voleva "'+giusta+'" 🙂'}</b><br>${spieg}
    ${tipo==='p' ? '' : `<div class="trick">Prova con "${prova}": «${fraseProva}» → ${haSenso?'ha senso ✅':'non ha senso ❌'}</div>`}`;
  if(ok) punti++; else errori.push([frase,giusta,scaduto?'tempo scaduto':scelta, giro[idx]]);
  salva('tot_esercizi', num('tot_esercizi')+1); if(ok) salva('tot_giuste', num('tot_giuste')+1);
  const tt=document.getElementById('totq'); if(tt) tt.textContent=num('tot_esercizi');
  suona(ok?'ok':'ko');
  const attesa = ok ? 2500 : 5000;
  const auto = document.getElementById('auto'), bar = document.getElementById('autobar');
  auto.style.display = 'block';
  requestAnimationFrame(()=>{ bar.style.transition = `width ${attesa}ms linear`; bar.style.width = '0%'; });
  clearTimeout(timer); timer = setTimeout(avanti, attesa);
}

function avanti(){ clearTimeout(timer); idx++; idx<giro.length ? domanda() : fine(); }

function fine(){
  const k = 'record_'+modo, rec = parseInt(leggi(k)||'0');
  const nuovo = punti>rec; if(nuovo) salva(k,punti);
  salva('tot_partite', num('tot_partite')+1);
  const superato = punti>=SOGLIA; if(superato) salva('sblocco_'+oggiStr(),'1');
  const report = creaReport(punti, giro.length, errori, superato);
  if(superato) salva('report_'+oggiStr(), report);
  suona('fine');
  const perc = punti/giro.length;
  const emoji = perc===1?'🏆':perc>=.8?'🌟':perc>=.6?'😊':'💪';
  const msg = perc===1?'Tutte giuste! Sei una campionessa!':perc>=.8?'Bravissima, quasi perfetto!':perc>=.6?'Bene! Ancora un po\' di allenamento.':'Non mollare: ripassa il trucco e riprova!';
  app.innerHTML = `
    <img class="hero" src="${IMG.amici}" alt="Alice e Giulia" style="max-width:240px">
    <div class="big">${emoji}</div>
    <div class="score">${punti} su ${giro.length}</div>
    <div class="msg">${msg}${nuovo&&rec>0?'<br>🎊 Nuovo record!':''}</div>
    ${superato ? `<div class="sblocco"><div>🔓 Ce l'hai fatta! Ecco il codice di oggi</div><div class="cod">${codiceDel(oggiStr())}</div><div class="small">Mandalo a papà per sbloccare il telefono</div><a class="wa wabig" href="${linkPapa(punti)}" target="_blank" rel="noopener">📲 Manda il codice a papà</a></div>`
               : `<div class="sblocco no"><div>🔒 Servono almeno ${SOGLIA} risposte giuste su 10 per il codice di sblocco.</div><div class="small">Ne hai fatte ${punti}: riprova, ce la puoi fare! 💪</div><a class="wa" href="${linkReport(report)}" target="_blank" rel="noopener">📲 Manda il resoconto a papà</a></div>`}
    ${errori.length?`<b>Da ripassare:</b><div class="rev">${errori.map(([f,g,s])=>`<div>${f.includes('___') ? f.replace('___',`<span class="c">${g}</span>`) : f+' → <span class="c">'+g+'</span>'} <span style="color:var(--muted)">(avevi messo "${s}")</span></div>`).join('')}</div>`:''}
    <div class="btns">
      <button class="btn" onclick="inizia(modo)">Gioca ancora</button>
      <button class="btn sec" onclick="home()">Cambia esercizio</button>
    </div>
    <div class="best">Record in questo esercizio: ${Math.max(rec,punti)} su ${giro.length}</div>
    <div class="tottitle">Il tuo allenamento in tutto</div>${statBox()}${traguardo()}`;
}

splash();
try{speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}
</script>

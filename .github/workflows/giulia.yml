name: Prepara video di Giulia
on:
  push:
    paths: ["tools/giulia-urls.txt.enc"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: dati
jobs:
  giulia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica e converte tutti i video (uno per riga in tools/giulia-urls.txt)
        env:
          SITE_CODE: ${{ secrets.SITE_CODE }}
        run: |
          mkdir -p assets
          rm -f assets/giulia*
          n=0
          # l'elenco degli indirizzi è cifrato anche lui
          node tools/open-file.mjs tools/giulia-urls.txt.enc > /tmp/urls.txt
          for url in $(grep -v '^ *$' /tmp/urls.txt); do
            n=$((n+1))
            curl -sSL -o /tmp/g.mp4 "$url"
            ffmpeg -nostdin -y -loglevel error -i /tmp/g.mp4 -vf "scale=720:-2,tpad=stop_mode=clone:stop_duration=1.2" -c:v libx264 -preset slow -crf 25 -an -movflags +faststart assets/giulia-$n.mp4
            ffmpeg -nostdin -y -loglevel error -i /tmp/g.mp4 -vf "tpad=stop_mode=clone:stop_duration=1.2,fps=10,scale=240:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer" assets/giulia-$n.gif
            ffmpeg -nostdin -y -loglevel error -ss 4.2 -i /tmp/g.mp4 -frames:v 1 -vf "scale=480:-2" assets/giulia-$n.jpg
          done
          echo "{\"n\":$n}" > assets/giulia.json
          # privati: cifrati con il codice del sito, come le schedine
          node tools/seal-file.mjs assets/giulia-*.mp4 assets/giulia-*.gif assets/giulia-*.jpg
          ls -la assets
      - name: Salva
        run: |
          git config user.name "giulia"
          git config user.email "giulia@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet && exit 0
          git commit -m "Video di Giulia"
          git pull --rebase -q && git push -q

name: Prova quote marcatori
on:
  workflow_dispatch:
    inputs:
      fixture: { description: "fixtureId OddsPapi", default: "" }
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s "https://api.oddspapi.io/v4/odds?fixtureId=${{ inputs.fixture }}&apiKey=${{ secrets.ODDSPAPI_KEY }}" -o /tmp/o.json
          python3 -c "
          import json;d=json.load(open('/tmp/o.json'))
          out=[]
          for bk,v in (d.get('bookmakerOdds') or {}).items():
            m=(v.get('markets') or {}).get('10733')
            if not m: continue
            o=(m.get('outcomes') or {}).get('10734') or {}
            pl=o.get('players') or {}
            out.append(bk+' giocatori '+str(len(pl))+' es: '+str([(k,x.get('price'),x.get('playerName') or x.get('name')) for k,x in list(pl.items())[:4]]))
          out.insert(0,'bookmaker totali '+str(len(d.get('bookmakerOdds') or {}))+', con gol giocatore: '+str(len(out)))
          open('tools/marcatori-prova.txt','w').write('\\n'.join(out)+'\\n')"
          git config user.name "pronostici-bot"; git config user.email "pronostici-bot@users.noreply.github.com"
          git add tools/marcatori-prova.txt; git commit -m "Prova quote marcatori" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

name: Prova ESPN
on:
  workflow_dispatch:
    inputs:
      lega: { description: "codice ESPN", default: "fra.coupe_de_france" }
      giorno: { description: "AAAAMMGG", default: "20261115" }
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/${{ inputs.lega }}/scoreboard?dates=${{ inputs.giorno }}" -o /tmp/e.json
          python3 -c "
          import json;d=json.load(open('/tmp/e.json'));ev=d.get('events',[])
          out=[str(len(ev))+' partite']
          for e in ev:
            c=e['competitions'][0];t={x['homeAway']:x['team'].get('displayName') for x in c['competitors']}
            out.append(e['date']+' | '+str(t.get('home'))+' | '+str(t.get('away'))+' | '+e['status']['type']['state'])
          open('tools/espn-prova.txt','w').write('\n'.join(out)+'\n')"
          git config user.name "pronostici-bot"; git config user.email "pronostici-bot@users.noreply.github.com"
          git add tools/espn-prova.txt; git commit -m "Prova ESPN" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

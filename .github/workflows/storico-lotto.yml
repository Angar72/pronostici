name: Scarica storico Lotto
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tools/storico
          git clone -q --depth 1 https://github.com/carinimaurizio2-code/storico-lotto /tmp/r || echo "clone fallito"
          find /tmp/r -type f -not -path '*/.git/*' -printf '%s %p\n' | head -40 > tools/storico/lotto-elenco.txt
          f=$(find /tmp/r -type f \( -name '*.txt' -o -name '*.csv' \) -not -path '*/.git/*' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          [ -n "$f" ] && tail -n 30000 "$f" > tools/storico/lotto.txt && head -5 tools/storico/lotto.txt >> tools/storico/lotto-elenco.txt
          rm -f tools/storico/lotto-errore.txt
          git config user.name "pronostici-bot"; git config user.email "pronostici-bot@users.noreply.github.com"
          git add tools/storico; git commit -m "Storico Lotto per le prove" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
